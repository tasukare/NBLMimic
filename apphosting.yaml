# apphosting.yaml
# Cloud Run service configuration for Firebase App Hosting

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: PORT
    value: "8080"
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: "static-webbing-512407-b3"
    availability:
      - RUNTIME
  - variable: FIREBASE_AUTH_DOMAIN
    value: "static-webbing-512407-b3.firebaseapp.com"
    availability:
      - RUNTIME
  - variable: FIREBASE_STORAGE_BUCKET
    value: "static-webbing-512407-b3.firebasestorage.app"
    availability:
      - RUNTIME
  - variable: FIREBASE_MESSAGING_SENDER_ID
    value: "809750403592"
    availability:
      - RUNTIME
